<!doctype html>
<!-- Inline backgrounds keep iOS/Android safe areas + overscroll dark on the
     marketing site (inline style beats the stylesheet's white body default).
     The light pages (/for-community-owners, /admin) flip these on mount. -->
<html lang="en" style="background: #0a0d0d">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d0d" />
    <link rel="icon" href="/cpoint-logo.png" />
    <title>C-Point | Enter the network where ideas connect people</title>
    <meta name="description" content="Invitation-only communities with a real feed and private messaging — not another public timeline. Available on iOS, Android, and Web. Steve in every community." />
    <meta name="author" content="C-Point" />

    <meta property="og:title" content="C-Point | Enter the network where ideas connect people" />
    <meta property="og:description" content="Private networks with shared memory for each group. Chat for speed, feed for what matters. Invitation-only — on iOS, Android, and Web." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.c-point.co" />
    <meta property="og:image" content="https://www.c-point.co/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="C-Point | Enter the network where ideas connect people" />
    <meta name="twitter:description" content="Private networks with shared memory for each group. Invitation-only — on iOS, Android, and Web." />
    <meta name="twitter:image" content="https://www.c-point.co/og-image.jpg" />

    <!-- Hanken Grotesk — the redesigned marketing site's typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Google Ads tag (AW-18311361204) with EEA Consent Mode v2.
         Defaults to denied; the consent banner (see end of body) can grant ad
         cookies. The choice is stored on `.c-point.co` so app.c-point.co
         inherits both the consent and the click-id cookie for conversion
         attribution. The tag itself loads on the production host only. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function () {
        if (!/(^|\.)c-point\.co$/.test(location.hostname)) return;
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'denied'
        });
        gtag('set', 'url_passthrough', true);
        if (document.cookie.indexOf('cp_ads_consent=granted') !== -1) {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
        }
        gtag('js', new Date());
        gtag('config', 'AW-18311361204');
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18311361204';
        document.head.appendChild(s);
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-Dp9sakeI.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DHFZmfUm.css">
  </head>

  <body style="background: #0a0d0d">
    <div id="root"></div>

    <!-- Ads-consent banner. Shown once (no cp_ads_consent cookie yet) on
         c-point.co hosts and localhost (for preview). Plain JS on purpose:
         self-contained, zero impact on the React bundle. -->
    <script>
      (function () {
        var isProd = /(^|\.)c-point\.co$/.test(location.hostname);
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isProd && !isLocal) return;
        if (document.cookie.indexOf('cp_ads_consent=') !== -1) return;

        var pt = (navigator.language || '').toLowerCase().indexOf('pt') === 0;
        var txt = pt
          ? 'Utilizamos cookies para medir o desempenho dos nossos anúncios. Dentro da C-Point não há anúncios.'
          : 'We use cookies to measure how our ads perform. There are no ads inside C-Point.';
        var accept = pt ? 'Aceitar' : 'Accept';
        var decline = pt ? 'Recusar' : 'Decline';
        var privacy = pt ? 'Política de privacidade' : 'Privacy policy';

        function setChoice(granted) {
          var cookie = 'cp_ads_consent=' + (granted ? 'granted' : 'denied') +
            '; path=/; max-age=15552000; SameSite=Lax';
          if (isProd) cookie += '; domain=.c-point.co; Secure';
          document.cookie = cookie;
          if (granted && typeof gtag === 'function') {
            gtag('consent', 'update', {
              ad_storage: 'granted',
              ad_user_data: 'granted',
              ad_personalization: 'granted'
            });
          }
          var el = document.getElementById('cp-ads-consent');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }

        var bar = document.createElement('div');
        bar.id = 'cp-ads-consent';
        bar.setAttribute('role', 'dialog');
        bar.setAttribute('aria-label', privacy);
        bar.style.cssText =
          'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);' +
          'width:calc(100% - 24px);max-width:560px;z-index:2147483000;' +
          'background:#0a0a0a;color:#fff;border:1px solid rgba(255,255,255,.14);' +
          'border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.45;' +
          'box-shadow:0 8px 30px rgba(0,0,0,.45);display:flex;flex-wrap:wrap;' +
          'gap:10px;align-items:center;justify-content:space-between;';
        var msg = document.createElement('span');
        msg.style.cssText = 'flex:1 1 260px;';
        msg.appendChild(document.createTextNode(txt + ' '));
        var link = document.createElement('a');
        link.href = '/privacy';
        link.textContent = privacy;
        link.style.cssText = 'color:#00CEC8;text-decoration:underline;';
        msg.appendChild(link);
        var btns = document.createElement('span');
        btns.style.cssText = 'display:flex;gap:8px;';
        var no = document.createElement('button');
        no.type = 'button';
        no.textContent = decline;
        no.style.cssText =
          'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);' +
          'border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;';
        no.onclick = function () { setChoice(false); };
        var yes = document.createElement('button');
        yes.type = 'button';
        yes.textContent = accept;
        yes.style.cssText =
          'background:#00CEC8;color:#000;border:none;border-radius:999px;' +
          'padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;';
        yes.onclick = function () { setChoice(true); };
        btns.appendChild(no);
        btns.appendChild(yes);
        bar.appendChild(msg);
        bar.appendChild(btns);
        document.body.appendChild(bar);
      })();
    </script>
  </body>
</html>
